# Analysis.Api (Stockfish) container. Engine__* defaults live in src/Services/Analysis/Analysis.Api/Dockerfile.
# JWT_SECRET_KEY is read from the .env file next to this compose file.
services:
  analysis-api:
    build:
      context: .
      dockerfile: src/Services/Analysis/Analysis.Api/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      Jwt__SecretKey: ${JWT_SECRET_KEY:?Set JWT_SECRET_KEY in .env}
      Jwt__Issuer: ${JWT_ISSUER:-ChessPlatform.Identity}
      Jwt__Audience: ${JWT_AUDIENCE:-ChessPlatform}
    ports:
      - "5085:8080"
    cpus: 2.0
    mem_limit: 512m
    restart: unless-stopped
